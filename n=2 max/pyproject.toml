[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maxmap"
version = "2.1.0"
description = "Numerical experiments and figures for the two-dimensional piecewise-smooth map of maxima"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oksana Satur" }]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.80",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
maxmap = "maxmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maxmap = ["py.typed"]

[tool.ruff]
line-length = 99
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # pep8-naming
    "D",             # pydocstyle
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "NPY",           # numpy-specific
    "PTH",           # pathlib
    "T20",           # no print
    "PL",            # pylint subset
]
ignore = [
    "PLR0913",  # many keyword arguments are natural for figure and experiment builders
    "PLR2004",  # numerical constants of the paper are named where they are reused
    "PLR0915",  # figure builders are long but linear
    "RUF001",   # Greek letters in docstrings are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take more than a few seconds (still part of the default run)",
]
